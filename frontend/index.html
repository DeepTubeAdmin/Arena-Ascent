<!doctype html>
<html lang="en">

    <meta name="robots" content="index, follow" />

    <meta property="og:url" content="https://arenaascent.com/" />
    <meta property="og:site_name" content="Arena Ascent" />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="https://arenaascent.com/og.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

          "name": "Arena Ascent",

        {
          "@type": "Organization",

          "url": "https://arenaascent.com/",
          "logo": "https://arenaascent.com/og.png"
        }
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
